<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Gallery ảnh phong cảnh responsive dùng Bootstrap Grid System.">
    <title>Gallery phong cảnh | Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container gallery-page py-5">
    <header class="gallery-header text-center mb-5">
        <p class="eyebrow mb-2">BỘ SƯU TẬP ẢNH</p>
        <h1 class="display-5 fw-bold mb-3">Thế giới qua ống kính</h1>
        <p class="lead text-secondary mb-0">Một vài khoảnh khắc bình yên từ những miền đất xa.</p>
    </header>

    <section class="row g-4" aria-label="Thư viện ảnh phong cảnh">
        <div class="col-12 col-sm-6 col-lg-3">
            <figure class="gallery-card h-100 mb-0">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&amp;fit=crop&amp;w=900&amp;q=85" class="img-fluid gallery-image" alt="Con đường nhỏ uốn lượn giữa thung lũng xanh" loading="lazy">
                <figcaption><span class="photo-category">THIÊN NHIÊN</span><h2>Con đường giữa thung lũng</h2><p>Đà Lạt, Việt Nam</p></figcaption>
            </figure>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
            <figure class="gallery-card h-100 mb-0">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=900&amp;q=85" class="img-fluid gallery-image" alt="Hồ nước trong xanh nằm dưới chân núi" loading="lazy">
                <figcaption><span class="photo-category">HỒ NƯỚC</span><h2>Mặt hồ tĩnh lặng</h2><p>Dolomites, Ý</p></figcaption>
            </figure>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
            <figure class="gallery-card h-100 mb-0">
                <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&amp;fit=crop&amp;w=900&amp;q=85" class="img-fluid gallery-image" alt="Sóng biển xanh vỗ vào bờ trong ánh sáng ban ngày" loading="lazy">
                <figcaption><span class="photo-category">ĐẠI DƯƠNG</span><h2>Nhịp sóng xanh</h2><p>Bờ biển nhiệt đới</p></figcaption>
            </figure>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
            <figure class="gallery-card h-100 mb-0">
                <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&amp;fit=crop&amp;w=900&amp;q=85" class="img-fluid gallery-image" alt="Ánh nắng xuyên qua tán cây trong khu rừng xanh" loading="lazy">
                <figcaption><span class="photo-category">RỪNG XANH</span><h2>Lối nhỏ trong rừng</h2><p>Rừng thông phương Bắc</p></figcaption>
            </figure>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
            <figure class="gallery-card h-100 mb-0">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=900&amp;q=85" class="img-fluid gallery-image" alt="Dãy núi cao phủ tuyết dưới nền trời trong" loading="lazy">
                <figcaption><span class="photo-category">NÚI CAO</span><h2>Chạm tới mây trời</h2><p>Dãy Alps</p></figcaption>
            </figure>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
            <figure class="gallery-card h-100 mb-0">
                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&amp;fit=crop&amp;w=900&amp;q=85" class="img-fluid gallery-image" alt="Mặt trời buổi sớm chiếu vàng trên cánh đồng" loading="lazy">
                <figcaption><span class="photo-category">BÌNH MINH</span><h2>Nắng sớm trên đồng</h2><p>Miền quê yên bình</p></figcaption>
            </figure>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
            <figure class="gallery-card h-100 mb-0">
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&amp;fit=crop&amp;w=900&amp;q=85" class="img-fluid gallery-image" alt="Phong cảnh đồi núi rộng lớn dưới bầu trời nhiều mây" loading="lazy">
                <figcaption><span class="photo-category">VIỄN DU</span><h2>Miền đất rộng mở</h2><p>Vùng cao nguyên</p></figcaption>
            </figure>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
            <figure class="gallery-card h-100 mb-0">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&amp;fit=crop&amp;w=900&amp;q=85" class="img-fluid gallery-image" alt="Hồ xanh và núi non soi bóng dưới nắng" loading="lazy">
                <figcaption><span class="photo-category">KHÁM PHÁ</span><h2>Góc trời bình yên</h2><p>Hồ trên núi</p></figcaption>
            </figure>
        </div>
    </section>

    <footer class="text-center text-secondary pt-5">
        <small>Thư viện ảnh phong cảnh · Thiết kế với Bootstrap Grid</small>
    </footer>
</main>
</body>
</html>
